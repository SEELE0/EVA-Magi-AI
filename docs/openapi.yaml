openapi: 3.1.0
info:
  title: MAGI Decision System API
  version: 1.1.0
  license:
    name: AGPL-3.0-or-later OR Commercial
    identifier: AGPL-3.0-or-later
  description: |
    MAGI 设定模拟应用的预留后端 REST 契约。当前仓库尚未提供可运行后端；
    前端默认使用本地 Mock。完整输出指可展示给用户的最终答复、理由、风险与建议，
    不包含模型隐藏推理或 chain-of-thought。
servers:
  - url: https://api.magi.local
    description: Replace with the local FastAPI or Spring Boot development server
security:
  - {}
  - BearerToken: []
paths:
  /v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Read system connectivity and protocol status
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/agents:
    get:
      operationId: getAgents
      summary: List the three MAGI nodes
      responses:
        '200':
          description: Fixed MAGI agent list
          content:
            application/json:
              schema:
                type: array
                minItems: 3
                maxItems: 3
                items:
                  $ref: '#/components/schemas/Agent'
        '429':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/agents/{agentId}/configuration:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getAgentConfiguration
      summary: Read one node's public provider and role-card configuration
      responses:
        '200':
          description: Public configuration; credentials are never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigurationPublic'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
    put:
      operationId: updateAgentConfiguration
      summary: Replace one node's provider and role-card configuration
      description: |
        `apiKey` is write-only. Store it encrypted or in a secret manager and return only
        `credentialConfigured`. Omit `apiKey` to keep the existing credential; set
        `clearCredential` to true to remove it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigurationUpdate'
      responses:
        '200':
          description: Updated public configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigurationPublic'
        '400':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/decisions:
    get:
      operationId: listDecisions
      summary: List decision history in reverse chronological order
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: Paginated decision history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionHistoryPage'
        '400':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createDecision
      summary: Create a decision packet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: Decision packet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/decisions/{decisionId}:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    get:
      operationId: getDecision
      summary: Read current decision and vote state
      responses:
        '200':
          description: Decision state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/decisions/{decisionId}/execute:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    post:
      operationId: executeDecision
      summary: Start or resume an idempotent three-Agent decision
      responses:
        '200':
          description: Current state after execution starts or resumes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/decisions/{decisionId}/events:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    get:
      operationId: getDecisionEvents
      summary: List decision events in ascending timestamp order
      parameters:
        - name: after
          in: query
          required: false
          description: Return only events newer than this ISO 8601 UTC timestamp.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Decision event trace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionEvent'
        '404':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/decisions/{decisionId}/results:
    parameters:
      - $ref: '#/components/parameters/DecisionId'
    get:
      operationId: getDecisionResults
      summary: Read the three complete user-visible Agent outputs
      description: |
        Returns final user-facing content and public provider metadata. It must not expose
        API keys, provider secrets, hidden reasoning, or chain-of-thought.
      responses:
        '200':
          description: Completed result set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResultSet'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Reserved for authenticated deployments; local v1 may allow anonymous access.
  parameters:
    DecisionId:
      name: decisionId
      in: path
      required: true
      description: Decision packet identifier.
      schema:
        type: string
        pattern: '^dec-[A-Za-z0-9-]+$'
    AgentId:
      name: agentId
      in: path
      required: true
      description: Fixed MAGI personality node identifier.
      schema:
        $ref: '#/components/schemas/AgentId'
  responses:
    ApiError:
      description: Standard API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AgentId:
      type: string
      enum: [MELCHIOR-1, BALTHASAR-2, CASPER-3]
    Vote:
      type: string
      enum: [approve, reject, abstain, pending]
    AgentHealth:
      type: string
      enum: [nominal, degraded, offline]
    DecisionStatus:
      type: string
      enum: [draft, running, completed, failed]
    Verdict:
      type: string
      enum: [approved, rejected, review, pending]
    EventKind:
      type: string
      enum: [created, scan, vote, verdict, failure]
    ConnectionMode:
      type: string
      enum: [mock, remote]
    ProviderConnection:
      type: string
      enum: [mock, openai-compatible, local-compatible]
    SystemStatus:
      type: object
      additionalProperties: false
      required: [systemName, connection, source, protocol, uptimeSeconds, updatedAt]
      properties:
        systemName:
          type: string
          example: MAGI DECISION SYSTEM
        connection:
          type: string
          enum: [online, degraded, offline]
        source:
          $ref: '#/components/schemas/ConnectionMode'
        protocol:
          type: string
          example: MAGI/3.0 REST
        uptimeSeconds:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        notice:
          type: string
    Agent:
      type: object
      additionalProperties: false
      required: [id, role, health, latencyMs, vote]
      properties:
        id:
          $ref: '#/components/schemas/AgentId'
        role:
          type: string
          example: 科学者論理
        health:
          $ref: '#/components/schemas/AgentHealth'
        latencyMs:
          type: integer
          minimum: 0
        vote:
          $ref: '#/components/schemas/Vote'
    AgentConfigurationPublic:
      type: object
      additionalProperties: false
      required: [agentId, role, connection, baseUrl, model, rolePrompt, credentialConfigured]
      properties:
        agentId:
          $ref: '#/components/schemas/AgentId'
        role:
          type: string
        connection:
          $ref: '#/components/schemas/ProviderConnection'
        baseUrl:
          type: string
          maxLength: 2048
        model:
          type: string
          maxLength: 200
        rolePrompt:
          type: string
          maxLength: 12000
        credentialConfigured:
          type: boolean
    AgentConfigurationUpdate:
      type: object
      additionalProperties: false
      required: [connection, baseUrl, model, rolePrompt]
      properties:
        connection:
          $ref: '#/components/schemas/ProviderConnection'
        baseUrl:
          type: string
          maxLength: 2048
          description: Validate and allowlist this URL server-side according to connection mode.
        model:
          type: string
          minLength: 1
          maxLength: 200
        rolePrompt:
          type: string
          minLength: 1
          maxLength: 12000
        apiKey:
          type: string
          minLength: 1
          maxLength: 4096
          format: password
          writeOnly: true
        clearCredential:
          type: boolean
          default: false
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 240
          example: 批准第 07 区域防御协议升级
        priority:
          type: string
          enum: [low, normal, critical]
          default: normal
        simulationHint:
          type: string
          description: Local mock-only hint. Real implementations should ignore this field.
          enum: [standard, reject, review]
    Votes:
      type: object
      additionalProperties: false
      required: [MELCHIOR-1, BALTHASAR-2, CASPER-3]
      properties:
        MELCHIOR-1:
          $ref: '#/components/schemas/Vote'
        BALTHASAR-2:
          $ref: '#/components/schemas/Vote'
        CASPER-3:
          $ref: '#/components/schemas/Vote'
    Decision:
      type: object
      additionalProperties: false
      required: [id, subject, priority, status, verdict, votes, createdAt]
      properties:
        id:
          type: string
          example: dec-0123abcd
        subject:
          type: string
        priority:
          type: string
          enum: [low, normal, critical]
        status:
          $ref: '#/components/schemas/DecisionStatus'
        verdict:
          $ref: '#/components/schemas/Verdict'
        votes:
          $ref: '#/components/schemas/Votes'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    DecisionHistoryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        nextCursor:
          type: string
          description: Opaque cursor; omit when there is no next page.
    AgentOutput:
      type: object
      additionalProperties: false
      required: [agentId, role, vote, output, connection, baseUrl, model, latencyMs, generatedAt]
      properties:
        agentId:
          $ref: '#/components/schemas/AgentId'
        role:
          type: string
        vote:
          $ref: '#/components/schemas/Vote'
        output:
          type: string
          description: Complete user-visible final answer, not hidden reasoning or chain-of-thought.
        connection:
          $ref: '#/components/schemas/ProviderConnection'
        baseUrl:
          type: string
        model:
          type: string
        latencyMs:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
    DecisionResultSet:
      type: object
      additionalProperties: false
      required: [decisionId, verdict, outputs]
      properties:
        decisionId:
          type: string
        verdict:
          $ref: '#/components/schemas/Verdict'
        outputs:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentOutput'
    DecisionEvent:
      type: object
      additionalProperties: false
      required: [id, decisionId, kind, timestamp, message]
      properties:
        id:
          type: string
          example: evt-e27d10aa
        decisionId:
          type: string
          example: dec-0123abcd
        kind:
          $ref: '#/components/schemas/EventKind'
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        agentId:
          $ref: '#/components/schemas/AgentId'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: DECISION_NOT_FOUND
        message:
          type: string
          example: 未找到指定的决策议题。
        requestId:
          type: string
          example: req_8d7b31
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
